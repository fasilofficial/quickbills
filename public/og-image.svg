    <path d="M25 20h20l15 15v25a5 5 0 0 1-5 5H25a5 5 0 0 1-5-5V25a5 5 0 0 1 5-5z" fill="#ffffff"/>
    <path d="M45 20v15h15" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
    <line x1="30" y1="40" x2="50" y2="40" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="44" y2="50" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>

